paths:
  models: "models/"
  datasets: "datasets/"
  outputs: "outputs/"
  logs: "outputs/logs/"

model_paths:
  yolov8_bike: "yolov8s.pt"
  yolov8_pose: "yolov8s-pose.pt"
  helmet_model: "models/helmet_best.pt"
  lp_model: "models/lp_best.pt"

thresholds:
  bike_conf_primary: 0.4
  bike_conf_fallback: 0.25
  nms_iou: 0.5
  keypoint_conf: 0.3
  rider_bike_iou_fallback: 0.15
  ocr_char_conf_min: 0.6

augmentations:
  mosaic: true
  hsv_jitter: true
  perspective: 15
  horizontal_flip: 0.5
  cutout: 0.3
  gamma_darkening: true
  motion_blur: true
  jpeg_compression: true
  rain_fog: true

training:
  helmet:
    epochs: 50
    resolution: 640
    patience: 10
  license_plate:
    epochs: 60
    resolution: 960
    patience: 12

inference:
  fast_mode: false
  use_cpu: false
  enable_fsrcnn: true
